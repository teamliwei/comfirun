[project]
name = "comfyrun-server"
version = "0.1.0"
description = "ComfyRun headless ComfyUI orchestration server (FastAPI + FIFO queue + Cloudflare tunnel)"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.24.0",
    "hf-transfer>=0.1.8",
    "pydantic>=2.0",
]

[tool.uv]
# The server itself never imports torch; ComfyUI runs as an isolated
# subprocess with its own environment (see setup.py).
